<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>果然消消 · 把烦恼一起消掉</title><style>
:root{--ink:#244332;--green:#28583d;--cream:#f7f6ee;--muted:#829084}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #e8a550;outline-offset:4px}button:disabled{cursor:default;opacity:.4}main{width:min(100% - 40px,480px);margin:auto;position:relative}header{display:flex;justify-content:space-between;align-items:center;padding:26px 0}.brand{font-size:13px;letter-spacing:2px;font-weight:800;text-decoration:none;color:var(--green)}.pill{border:1px solid #d9dfd2;background:transparent;border-radius:30px;padding:7px 13px;font-size:11px}.intro{text-align:center;padding:15px 0 25px}.eyebrow{font-size:9px;letter-spacing:1.7px;color:#7c8b77}h1{font-size:58px;letter-spacing:-4px;margin:9px 0 7px;font-weight:900;position:relative;line-height:1.2}h1 span{color:#739452}h1 i{font-size:27px;display:inline-block;vertical-align:top;transform:rotate(12deg);margin:7px 0 0 10px;color:#e9ac51;font-style:normal}.intro p{font-size:12px;color:#748270;margin:10px}.game{background:#fffefa;border:1px solid #e0e5d8;border-radius:25px;padding:23px;box-shadow:0 16px 45px #30572b09}.game-top{display:flex;justify-content:space-between;align-items:center}.level{font-size:11px;font-weight:700;letter-spacing:1px;background:#edf2e4;padding:7px 11px;border-radius:8px}.text-btn{border:0;background:none;font-size:11px;color:#7f8a77}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:23px 0 16px}.stats div+div{border-left:1px solid #edf0e7}.stats small{display:block;font-size:10px;color:#8a9483}.stats strong{font-size:27px;font-family:ui-monospace,Consolas,monospace;display:block;margin-top:6px}.progress{height:4px;background:#ecf0e3;border-radius:5px;overflow:hidden}.progress div{height:100%;width:0;background:#88a969;transition:width .3s}.board-wrap{position:relative;background:#f0f3e8;border-radius:16px;margin:20px 0 19px;padding:23px 12px 12px;overflow:hidden;min-height:280px;display:flex;flex-direction:column;justify-content:center}.sprout{position:absolute;top:-16px;right:0;color:#e3e9d4;font-size:135px;transform:rotate(15deg);pointer-events:none}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;position:relative;z-index:1}.cell{position:relative;aspect-ratio:1}.tile{height:100%;width:100%;border:1px solid #e3e4cd;border-bottom:4px solid #d3d8bc;background:#fffef5;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5.7vw,28px);position:relative;transition:transform .12s,background .15s;box-shadow:0 3px 5px #4563310a}.tile:hover{transform:translateY(-3px);background:white}.tile:active{transform:scale(.91)}.cell.stacked:before{content:"";position:absolute;inset:4px -2px -4px 2px;background:#d8e1c8;border:1px solid #c0ccad;border-radius:10px}.tile.hinted{outline:3px solid #ecb24c;animation:pulse .5s infinite alternate}.board-note{font-size:10px;text-align:center;color:#89947b;margin-top:20px;letter-spacing:1px;z-index:1}.tray-head{display:flex;justify-content:space-between;font-size:10px;margin-bottom:10px}.tray-head b{font-weight:500;letter-spacing:1px}.tray-head span{color:#89947c}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#eaf0df;padding:9px;border-radius:12px}.slot{aspect-ratio:1;background:#dce5cd;border-radius:7px;display:flex;justify-content:center;align-items:center;font-size:24px;border:1px solid #d7e1c8}.slot.filled{background:#fffdf3;border-bottom:3px solid #cbd4b9;animation:pop .15s}.tray.danger{background:#f6ded0}.tools{display:flex;justify-content:space-around;margin-top:22px;gap:10px}.tools button{background:none;border:0;flex:1;padding:0}.tools button>span{display:flex;justify-content:center;align-items:center;background:#f0f3e7;border:1px solid #e4e9d9;border-radius:13px;font-size:25px;width:48px;height:43px;margin:0 auto 8px}.tools b{display:block;font-size:11px;font-weight:500}.tools small{display:block;font-size:9px;color:#9ba48f;margin-top:5px}.tip{font-size:9px;text-align:center;color:#9aa48c;margin:23px 0 0}footer{display:flex;justify-content:space-between;font-size:9px;color:#9aa48c;padding:20px 4px 30px}footer b{font-weight:400}.ambient{position:fixed;border-radius:50%;z-index:-1;filter:blur(2px)}.a{width:350px;height:350px;background:#e8eddb;top:10%;left:-160px}.b{width:250px;height:250px;background:#f4e6cf;bottom:-50px;right:-110px}#toast{position:fixed;bottom:35px;left:50%;transform:translate(-50%,20px);background:#244332;color:#fff;padding:12px 20px;border-radius:30px;opacity:0;transition:.2s;pointer-events:none;z-index:10;font-size:12px;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#203b2c77;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20}.overlay[hidden]{display:none}.dialog{width:min(340px,90vw);background:#fffef6;padding:32px;text-align:center;border-radius:24px;box-shadow:0 20px 80px #152d3344}.dialog>span{font-size:65px;color:#8aa56b;display:block}.dialog>small{font-size:9px;letter-spacing:3px;color:#8ca06f}.dialog h2{font-size:25px;margin:15px 0}.dialog p{font-size:12px;color:#7e8a73;line-height:1.9}.dialog button{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin-top:12px;font-size:12px}.primary{background:#315a3f;color:white}.secondary{background:#edf1e5}.confetti{position:fixed;top:-20px;pointer-events:none;z-index:22;animation:fall 2s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(600deg);opacity:0}}@keyframes pulse{to{transform:translateY(-4px)}}@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}@media(min-width:900px){main{width:440px}.intro{padding-top:9px}header{padding-top:22px}.a{left:calc(50% - 500px)}.b{right:calc(50% - 500px)}}@media(max-width:380px){main{width:calc(100% - 24px)}.game{padding:16px}.board{gap:5px}h1{font-size:50px}}
[hidden]{display:none!important}
.board{grid-template-columns:repeat(6,minmax(0,1fr))}.tile{min-width:0;padding:0}.slot{min-width:0}
</style></head>
<body><div class="ambient a"></div><div class="ambient b"></div><main>
<header><a class="brand" href="./">✳ FRUIT CLUB</a><button id="sound" class="pill" aria-label="开启音效">音效 关</button></header>
<section class="intro"><span class="eyebrow">给大脑放个小假 / A LITTLE FRUIT BREAK</span><h1>果然<span>消消</span><i>✳</i></h1><p>三个凑一起，把烦恼一起消掉。</p></section>
<section class="game" aria-label="水果三消游戏"><div class="game-top"><span class="level" id="level">01 / 热身果园</span><button id="restart" class="text-btn">↻ 重新开始</button></div>
<div class="stats"><div><small>本局得分</small><strong id="score">000</strong></div><div><small>剩余水果</small><strong id="left">18</strong></div><div><small>最好成绩</small><strong id="best">000</strong></div></div>
<div class="progress"><div id="progress"></div></div><div class="board-wrap"><div class="sprout">✳</div><div id="board" class="board"></div><div class="board-note" id="note">点选水果 · 三个相同即可消除</div></div>
<div class="tray-head"><b>水果暂存篮</b><span id="tray-count">0 / 7</span></div><div id="tray" class="tray" aria-label="七格暂存篮"></div>
<div class="tools"><button id="undo"><span>↶</span><b>撤回一步</b><small id="undo-count">本局 1 次</small></button><button id="shuffle"><span>⤨</span><b>重新洗牌</b><small id="shuffle-count">本局 1 次</small></button><button id="hint"><span>☼</span><b>给点灵感</b><small>寻找可消组合</small></button></div>
<p class="tip">小诀窍：先看暂存篮，再找相同的水果。</p></section>
<footer><span>轻轻一点，快乐多一点。</span><b>原创界面 · AI 辅助开发原型</b></footer>
</main><div id="toast" role="status"></div><div id="modal" class="overlay" hidden><div class="dialog"><span id="result-icon">✳</span><small id="result-tag">NICE PICK!</small><h2 id="result-title">果然有两下子</h2><p id="result-copy"></p><button id="next" class="primary">挑战下一关 →</button><button id="again" class="secondary">再来一次</button></div></div><script>(()=>{'use strict';
const $=id=>document.getElementById(id), fruits=['🍊','🍓','🍇','🥝','🍋','🍒'];
let level=1,cells=[],tray=[],score=0,total=0,history=null,undo=1,shuffle=1,ended=false,sound=false,best=0,toastTimer,audio;
try{best=Number(localStorage.getItem('fruit-best'))||0}catch{}
const mix=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function tone(match=false){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(match?660:420,audio.currentTime);o.frequency.exponentialRampToValueAtTime(match?990:520,audio.currentTime+.12);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.2)}catch{}}
function start(l=level){level=l;const count=l===1?18:54;let deck=[];for(let i=0;i<count/3;i++)deck.push(...Array(3).fill(fruits[i%6]));mix(deck);cells=Array.from({length:l===1?18:36},()=>[]);deck.forEach((f,i)=>cells[i%cells.length].push(f));tray=[];score=0;total=count;history=null;undo=1;shuffle=1;ended=false;$('modal').hidden=true;render()}
function render(){const remain=cells.reduce((s,c)=>s+c.length,0);$('level').textContent=level===1?'01 / 热身果园':'02 / 叠叠果园';$('score').textContent=String(score).padStart(3,'0');$('best').textContent=String(best).padStart(3,'0');$('left').textContent=remain;$('progress').style.width=((total-remain-tray.length)/total*100)+'%';$('board').replaceChildren();cells.forEach((stack,i)=>{const cell=document.createElement('div');cell.className='cell'+(stack.length>1?' stacked':'');if(stack.length){const b=document.createElement('button');b.className='tile';b.textContent=stack.at(-1);b.setAttribute('aria-label','选择'+stack.at(-1));b.onclick=()=>pick(i);cell.append(b)}$('board').append(cell)});$('tray').replaceChildren();for(let i=0;i<7;i++){const s=document.createElement('div');s.className='slot'+(tray[i]?' filled':'');s.textContent=tray[i]||'';$('tray').append(s)}$('tray').classList.toggle('danger',tray.length>=5);$('tray-count').textContent=tray.length+' / 7';$('undo').disabled=!undo||!history||ended;$('shuffle').disabled=!shuffle||ended;$('hint').disabled=ended;$('undo-count').textContent='本局 '+undo+' 次';$('shuffle-count').textContent='本局 '+shuffle+' 次';$('note').textContent=level===1?'点选水果 · 三个相同即可消除':'上层取走后，下层水果才会露出来'}
function pick(i){if(ended||!cells[i].length)return;history={cells:cells.map(c=>[...c]),tray:[...tray],score};const f=cells[i].pop();const last=tray.lastIndexOf(f);tray.splice(last<0?tray.length:last+1,0,f);const n=tray.filter(x=>x===f).length;let matched=false;if(n===3){tray=tray.filter(x=>x!==f);score+=100;matched=true;toast('漂亮！三消 +100')}tone(matched);if(score>best){best=score;try{localStorage.setItem('fruit-best',best)}catch{}}render();if(cells.every(c=>!c.length)&&!tray.length)finish(true);else if(tray.length>=7)finish(false)}
function finish(win){ended=true;render();$('result-icon').textContent=win?'✳':'🍃';$('result-tag').textContent=win?'NICE PICK!':'TAKE A LITTLE BREAK';$('result-title').textContent=win?'果然有两下子':'果篮有点挤啦';$('result-copy').textContent=win?'本局获得 '+score+' 分。'+(level===1?'来挑战双层果园吧！':'双层果园也被你拿下了！'):'拿下 '+score+' 分，再试一次。优先凑齐篮子里的水果。';$('next').textContent=level===1?'挑战双层果园 →':'再挑战双层果园 →';$('next').hidden=!win;$('modal').hidden=false;if(win)for(let i=0;i<32;i++){const p=document.createElement('span');p.className='confetti';p.textContent=['✳','●','■'][i%3];p.style.cssText=`left:${Math.random()*100}%;color:${['#91a969','#edb454','#ed9375'][i%3]};animation-delay:${Math.random()*.4}s`;document.body.append(p);setTimeout(()=>p.remove(),2600)}}
$('undo').onclick=()=>{if(!undo||!history||ended)return;cells=history.cells;tray=history.tray;score=history.score;history=null;undo--;render();toast('已撤回上一步')};
$('shuffle').onclick=()=>{if(!shuffle||ended)return;const a=mix(cells.flat());cells=cells.map(c=>c.map(()=>a.pop()));shuffle--;history=null;render();toast('果园已重新洗牌')};
$('hint').onclick=()=>{const visible=cells.map((c,i)=>({f:c.at(-1),i})).filter(c=>c.f);const candidate=fruits.map(f=>({f,need:3-tray.filter(x=>x===f).length})).sort((a,b)=>a.need-b.need).find(c=>visible.filter(x=>x.f===c.f).length>=c.need);if(!candidate){toast('暂时没有完整组合，试试洗牌');return}visible.filter(c=>c.f===candidate.f).slice(0,candidate.need).forEach(c=>$('board').children[c.i].firstElementChild.classList.add('hinted'));toast('试试发光的水果')};
$('restart').onclick=()=>{if(!ended&&history&&!confirm('重新开始当前关卡？'))return;start()};$('again').onclick=()=>start();$('next').onclick=()=>start(2);$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音效 '+(sound?'开':'关');$('sound').setAttribute('aria-label',sound?'关闭音效':'开启音效');tone()};start();
})();
</script></body></html>
